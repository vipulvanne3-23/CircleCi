version: 2.1

jobs:
  build:
    docker:
      - image: python
    steps:
      - checkout
      - run:
          name: "Run Main"
          command: python Main1.py

  test:
    docker:
      - image: python
    steps:
      - checkout
      - run:
          name: "Run Tests"
          command: python Test.py
      - run:
          name: "Say hello"
          command: echo "Hello, World!"

workflows:
  build_and_test:
    jobs:
      - build
      - test
